packages:
  "framer-motion": "For page transitions, card hovers, and premium micro-interactions"
  "recharts": "For the admin panel dashboard charts and analytics"
  "date-fns": "For formatting dates in dashboard and admin tables"
  "react-hook-form": "For handling the dynamic smart forms"
  "@hookform/resolvers": "For form validation"
  "lucide-react": "For UI icons across the application"

images:
